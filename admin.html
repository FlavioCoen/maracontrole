<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
  </head>
  <body>
    <h2>Lista de Cadastros</h2>
    <table border="1" id="tabela">
      <tr>
        <th>Nome</th>
        <th>Email</th>
        <th>Telefone</th>
        <th>DataCadastro</th>
      </tr>
    </table>

    <script>
      // Chama o Apps Script para obter os dados
      google.script.run.withSuccessHandler(function(dados){
        var tabela = document.getElementById('tabela');
        dados.forEach(function(linha){
          var tr = document.createElement('tr');
          tr.innerHTML = '<td>' + linha.Nome + '</td>' +
                         '<td>' + linha.Email + '</td>' +
                         '<td>' + linha.Telefone + '</td>' +
                         '<td>' + linha.DataCadastro + '</td>';
          tabela.appendChild(tr);
        });
      }).getDados();
    </script>
  </body>
</html>
