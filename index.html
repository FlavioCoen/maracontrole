<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro</title>
  <style>
    body { font-family: Arial; margin: 40px; background: #f7f7f7; }
    h2 { color: #333; }
    form { max-width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 5px #ccc; }
    input, button { display: block; margin: 10px 0; padding: 10px; width: 100%; border-radius: 4px; border: 1px solid #ccc; }
    button { background: #007bff; color: white; cursor: pointer; border: none; }
    button:hover { background: #0056b3; }
    #mensagem { color: green; margin-top: 15px; }
  </style>
</head>
<body>
  <h2>Cadastro de Usuário</h2>
  <form id="formCadastro">
    <input type="text" id="nome" placeholder="Nome" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="text" id="telefone" placeholder="Telefone" required>
    <button type="submit">Cadastrar</button>
  </form>

  <p id="mensagem"></p>

  <script>
    // Nova URL do Web App
    const scriptURL = "https://script.google.com/macros/s/AKfycbz64noJUVy0dA7NvnKKUeW62LsLFAEeEqqZbAYex1UDFMPUn2BCOYlFIHGMNetoOsZFJg/exec";

    document.getElementById("formCadastro").addEventListener("submit", async (e) => {
      e.preventDefault();

      const data = {
        nome: document.getElementById("nome").value,
        email: document.getElementById("email").value,
        telefone: document.getElementById("telefone").value
      };

      try {
        const resposta = await fetch(scriptURL, {
          method: "POST",
          body: JSON.stringify(data),
          headers: { "Content-Type": "application/json" }
        });
        const texto = await resposta.text();
        document.getElementById("mensagem").textContent = texto;
        e.target.reset();
      } catch (err) {
        document.getElementById("mensagem").textContent = "Erro ao enviar dados. Verifique sua conexão.";
      }
    });
  </script>
</body>
</html>
