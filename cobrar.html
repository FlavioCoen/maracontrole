<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Calculadora de Taxas - Quanto Cobrar do Cliente</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 30px;
        background: #f5f5f5;
    }
    .box {
        background: white;
        padding: 20px;
        border-radius: 10px;
        max-width: 400px;
        margin: auto;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, select, button {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        font-size: 16px;
    }
    button {
        background: #007bff;
        color: white;
        cursor: pointer;
        border: none;
        border-radius: 5px;
    }
    button:hover {
        background: #0069d9;
    }
    .resultado {
        margin-top: 15px;
        padding: 15px;
        background: #e9ffe9;
        border-left: 5px solid #2ecc71;
        font-size: 18px;
        display: none;
    }
</style>
</head>
<body>

<div class="box">
    <h2>Calculadora de Valor a Cobrar</h2>

    <label>Valor que você deseja receber (R$):</label>
    <input type="number" id="valorReceber" placeholder="Ex: 100" step="0.01">

    <label>Forma de Pagamento / Parcelas:</label>
    <select id="formaPagamento">
        <option value="1.69">Débito - 1,69%</option>
        <option value="3.99">Crédito 1x - 3,99%</option>
        <option value="8.99">Crédito 2x - 8,99%</option>
        <option value="9.99">Crédito 3x - 9,99%</option>
        <option value="11.99">Crédito 4x - 11,99%</option>
        <option value="13.49">Crédito 5x - 13,49%</option>
        <option value="15.49">Crédito 6x - 15,49%</option>
        <option value="16.99">Crédito 7x - 16,99%</option>
        <option value="17.99">Crédito 8x - 17,99%</option>
        <option value="18.99">Crédito 9x - 18,99%</option>
        <option value="19.99">Crédito 10x - 19,99%</option>
        <option value="19.99">Crédito 11x - 19,99%</option>
        <option value="19.99">Crédito 12x - 19,99%</option>
    </select>

    <button onclick="calcular()">Calcular Valor a Cobrar</button>

    <div class="resultado" id="resultado"></div>
</div>

<script>
function calcular() {
    let valorReceber = parseFloat(document.getElementById("valorReceber").value);
    let taxa = parseFloat(document.getElementById("formaPagamento").value);

    if (isNaN(valorReceber) || valorReceber <= 0) {
        alert("Digite um valor válido para receber.");
        return;
    }

    // Cálculo reverso: valor a cobrar = líquido / (1 - taxa)
    let taxaDecimal = taxa / 100;
    let valorCobrar = valorReceber / (1 - taxaDecimal);

    document.getElementById("resultado").style.display = "block";
    document.getElementById("resultado").innerHTML =
        "<b>Você deve cobrar:</b> R$ " + valorCobrar.toFixed(2) +
        "<br><br><b>Taxa aplicada:</b> " + taxa + "%";
}
</script>

</body>
</html>
